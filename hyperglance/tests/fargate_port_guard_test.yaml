suite: fargate path — privileged-port guard, targetPort/annotation tracking
templates:
  - statefulset.yaml
  - loadbalancer.yaml
  - ingress.yaml
tests:
  - it: fails fast when fargate.enabled and a port is privileged (default ports)
    template: statefulset.yaml
    set:
      fargate.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'EKS Fargate'

  - it: fails fast when fargate.enabled and only https is left privileged
    template: statefulset.yaml
    set:
      fargate.enabled: true
      servicehttp.port: 8080
    asserts:
      - failedTemplate:
          errorPattern: 'EKS Fargate'

  - it: APACHE_DISABLE_HTTPS true on fargate with http raised renders successfully
    template: statefulset.yaml
    set:
      fargate.enabled: true
      servicehttp.port: 8080
      hyperglanceEnvVars.APACHE_DISABLE_HTTPS: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="httpd")].env[?(@.name=="APACHE_HTTP_PORT")].value
          value: "8080"

  - it: loadbalancer targetPort follows servicehttps.port when raised above 1024
    template: loadbalancer.yaml
    set:
      fargate.enabled: true
      servicehttp.port: 8080
      servicehttps.port: 8443
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 8443

  - it: ingress listen-ports/ssl-redirect annotations follow the configured ports when raised above 1024
    template: ingress.yaml
    set:
      fargate.enabled: true
      servicehttp.port: 8080
      servicehttps.port: 8443
    asserts:
      - matchRegex:
          path: metadata.annotations["alb.ingress.kubernetes.io/listen-ports"]
          pattern: '8443'
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/ssl-redirect"]
          value: "8443"

  - it: ingress backend port.number does NOT track servicehttps.port (regression guard)
    template: ingress.yaml
    set:
      fargate.enabled: true
      servicehttp.port: 8080
      servicehttps.port: 8443
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 443

suite: AI Secret generation and credential guards
templates:
  - secret.yaml
tests:
  - it: creates the llama api-key Secret from apiKey when no existingSecretName
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-llama-api-key
    set:
      ai.llama.enabled: true
      ai.llama.apiKey: testkey
    asserts:
      - equal:
          path: stringData.LLAMA_API_KEY
          value: testkey
  # With default values secret.yaml renders httpd-ssl + license. Enabling llama with apiKey
  # adds the llama-api-key Secret (3 docs); a BYO existingSecretName must NOT add it (2 docs).
  - it: also renders the chart llama Secret (3 docs total) when apiKey is used
    set:
      ai.llama.enabled: true
      ai.llama.apiKey: testkey
    asserts:
      - hasDocuments:
          count: 3
  - it: does not render a chart llama Secret when existingSecretName is set
    set:
      ai.llama.enabled: true
      ai.llama.existingSecretName: my-byo-secret
    asserts:
      - hasDocuments:
          count: 2
  - it: passes ai.mcp.hgApi.authorization through to HG_AUTHORIZATION verbatim
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-mcp-auth
    set:
      ai.mcp.enabled: true
      ai.mcp.hgApi.enabled: true
      ai.mcp.hgApi.authorization: "Basic Ym9iOnB3"
    asserts:
      - equal:
          path: stringData.HG_AUTHORIZATION
          value: Basic Ym9iOnB3
  - it: fails when llama is enabled with an empty apiKey and no existingSecretName
    set:
      ai.llama.enabled: true
      ai.llama.apiKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "ai.llama.enabled requires a non-empty ai.llama.apiKey"
  - it: fails when hgApi is enabled without an authorization value
    set:
      ai.mcp.enabled: true
      ai.llama.enabled: true
      ai.llama.apiKey: testkey
      ai.mcp.hgApi.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "requires a non-empty ai.mcp.hgApi.authorization"

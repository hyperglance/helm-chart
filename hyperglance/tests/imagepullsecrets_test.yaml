suite: privateImageRepos key validation
templates:
  - statefulset.yaml
tests:
  - it: fails render on a non-DNS-1123 privateImageRepos key
    set:
      privateImageRepos.Bad_Key.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "must be a DNS-1123 label"
  - it: renders the main StatefulSet for a valid DNS-1123 key
    set:
      privateImageRepos.myrepo.enabled: true
      privateImageRepos.myrepo.registry: https://example.com
      privateImageRepos.myrepo.username: u
      privateImageRepos.myrepo.password: p
      privateImageRepos.myrepo.email: e@example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: StatefulSet

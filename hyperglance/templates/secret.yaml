{{- /*
  Fail-fast validations for AI credentials. A blank key would ship a no-auth llama on a
  SAML-bypassed path (a security regression), and an empty hgApi authorization yields a
  no-auth HG_AUTHORIZATION — so reject these at render time rather than silently shipping them.
*/}}
{{- if and .Values.ai.llama.enabled (not .Values.ai.llama.existingSecretName) (empty (.Values.ai.llama.apiKey | default "" | trim)) }}
{{- fail "ai.llama.enabled requires a non-empty ai.llama.apiKey (or set ai.llama.existingSecretName to bring your own Secret)" }}
{{- end }}
{{- if and .Values.ai.mcp.hgApi.enabled (not .Values.ai.mcp.hgApi.existingSecretName) (empty (.Values.ai.mcp.hgApi.authorization | default "" | trim)) }}
{{- fail "ai.mcp.hgApi.enabled requires a non-empty ai.mcp.hgApi.authorization (or set ai.mcp.hgApi.existingSecretName)" }}
{{- end }}
{{- /*
  Fail-fast validation for the bundled-model node pin. pv-llama-model.yaml's whole body is
  gated on bundledModelHostPath being set, so a guard placed there can never catch the reverse
  case (modelNodeName set, bundledModelHostPath empty) — both directions have to live somewhere
  that always renders, hence here rather than in pv-llama-model.yaml itself.
*/}}
{{- if and .Values.ai.llama.enabled .Values.ai.llama.bundledModelHostPath (empty (.Values.ai.llama.modelNodeName | default "" | trim)) }}
{{- fail "ai.llama.bundledModelHostPath requires a non-empty ai.llama.modelNodeName (the Kubernetes node name where the model file was placed)" }}
{{- end }}
{{- if and .Values.ai.llama.enabled (not (empty (.Values.ai.llama.modelNodeName | default "" | trim))) (empty (.Values.ai.llama.bundledModelHostPath | default "" | trim)) }}
{{- fail "ai.llama.modelNodeName has no effect without ai.llama.bundledModelHostPath also being set" }}
{{- end }}
{{ if not .Values.httpdSSL.existingSecretName  }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-httpd-ssl"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  hyperglance.crt: {{- .Values.httpdSSL.certificate | toYaml | indent 1 }}
  hyperglance.key: {{- .Values.httpdSSL.key | toYaml | indent 1 }}
  ca_bundle.crt: {{- .Values.httpdSSL.caBundle | default "UNSET" | toYaml | indent 1 }}
{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-license"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  hg.bin: {{ .Values.hgBin }}

{{ if and (.Values.saml.enabled) (not .Values.saml.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-httpd-saml"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  idp.xml: {{- .Values.saml.idpXml | toYaml | indent 1 }}
  sp.xml: {{- .Values.saml.spXml | toYaml | indent 1 }}
  sp.cert: {{- .Values.saml.spCert | toYaml | indent 1 }}
  sp.key: {{- .Values.saml.spKey | toYaml | indent 1 }}
{{ end }}

{{ if and (.Values.customPostgres.enabled) (not .Values.customPostgres.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-custom-postgresql-db"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  POSTGRESQL_HOST: "{{ .Values.customPostgres.host }}"
  POSTGRESQL_PORT: "{{ .Values.customPostgres.port }}"
  POSTGRESQL_USERNAME: "{{ .Values.customPostgres.user }}"
  POSTGRESQL_PASSWORD: "{{ .Values.customPostgres.pass }}"
{{ end }}

{{ if and (.Values.proxy.enabled) (not .Values.proxy.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-proxy-settings"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  PROXY_HOST: "{{ .Values.proxy.host }}"
  PROXY_PORT: "{{ .Values.proxy.port }}"
  PROXY_USER: "{{ .Values.proxy.user }}"
  PROXY_PASSWORD: "{{ .Values.proxy.pass }}"
{{ end }}

{{ if and (.Values.privateImageRepo.enabled) (not .Values.privateImageRepo.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-repo-secret
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
  .dockerconfigjson: "{{ include "imagePullSecret" .Values.privateImageRepo }}"
type: kubernetes.io/dockerconfigjson
{{ end }}

{{- range $name, $repo := .Values.privateImageRepos }}
{{- if and $repo.enabled (not $repo.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-repo-secret-%s" $.Release.Name $name }}
  labels:
    app: {{ template "hyperglance.name" $ }}
    chart: {{ template "hyperglance.chart" $ }}
    release: "{{ $.Release.Name }}"
    heritage: "{{ $.Release.Service }}"
data:
  .dockerconfigjson: "{{ include "imagePullSecret" $repo }}"
type: kubernetes.io/dockerconfigjson
{{- end }}
{{- end }}

{{ if and (.Values.ai.llama.enabled) (.Values.ai.llama.hfToken.enabled) (not .Values.ai.llama.hfToken.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-llama-hf-token"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  HF_TOKEN: "{{ .Values.ai.llama.hfToken.value }}"
{{ end }}

{{ if and (.Values.ai.llama.enabled) (not .Values.ai.llama.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-llama-api-key"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  # Static api key llama-server enforces; also injected by httpd on the /llama proxy.
  LLAMA_API_KEY: {{ .Values.ai.llama.apiKey | default "" | quote }}
{{ end }}

{{ if and (.Values.ai.mcp.enabled) (.Values.ai.mcp.hgApi.enabled) (not .Values.ai.mcp.hgApi.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-mcp-auth"
  labels:
    app: {{ template "hyperglance.name" . }}
    chart: {{ template "hyperglance.chart" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
stringData:
  # Passed through verbatim — the Authorization header value shown in the Hyperglance UI
  # when the API key was created (e.g. "Basic dGVzdGluZzpl...").
  HG_AUTHORIZATION: {{ .Values.ai.mcp.hgApi.authorization | quote }}
{{ end }}
